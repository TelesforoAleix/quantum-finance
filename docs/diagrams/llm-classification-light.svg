<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="LLM classification: each of 777 processed papers goes through six sequential LLM calls that reuse the same paper text, which give a structured profile and extraction JSON; 755 papers are used downstream. Limit: single LLM, single pass.">
