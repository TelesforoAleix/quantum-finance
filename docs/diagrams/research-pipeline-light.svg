<text x="440" y="306" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" fill="#656560">The paper corpus and the extraction pipeline are private.</text>
<text x="440" y="326" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" fill="#656560">This repository does not reproduce the thesis results.</text>
