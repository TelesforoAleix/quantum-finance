<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="S4 to S5 thematic chain in BPMN with three lanes: LLM, automatic checks and researchers. Per paper: A1 open coding, L1 quote verification, A2 memo, L2 claim tracing, L3 adversarial review, then the R1 researcher review gate on a stratified sample; an overlay re-reads multi-silo papers. Per silo: B1 descriptive themes, B2 analytical themes, C2 cross-vendor grounding with grounded, partial and unsupported exits, researcher disposition of unsupported themes, and S5 cross-silo meta-themes. The R1 sample informs the acceptance rules for theme construction.">
