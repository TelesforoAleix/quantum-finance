<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Phase 3 corpus flow: S1 silo scoping takes 777 papers to 658 papers in 8 silos and routes them into three tracks. Quantitative: S2 extraction and S3 advantage assessment. Qualitative: S4 thematic coding and S5 cross-silo synthesis. Descriptive: S6 finance framing. All tracks feed the integrated synthesis, and the viable candidates from S3 feed the 71 circuits of P4.">
