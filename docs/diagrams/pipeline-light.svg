<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Research pipeline: P1 framework synthesis, P2 systematic review, P3 thematic synthesis and P4 resource estimation, ending in the finding that none of the 13 closest circuits passed all five criteria.">
<title>Research pipeline: P1 framework synthesis, P2 systematic review, P3 thematic synthesis and P4 resource estimation, ending in the finding that none of the 13 closest circuits passed all five criteria.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D00"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656560"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="340" fill="#F2F2EF"/>
<text x="40" y="42" font-family='"SFMono-Regular", Consolas, monospace' font-size="13" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">RESEARCH PIPELINE · FOUR PHASES</text>
<line x1="40" y1="58" x2="1160" y2="58" stroke="#CDCDC7" stroke-width="1"/>
<circle cx="48" cy="142.0" r="14" fill="none" stroke="#171717" stroke-width="1"/>
<polyline points="62,142.0 100,142.0" fill="none" stroke="#171717" stroke-width="1" marker-end="url(#a)"/>
<text x="100" y="96" font-family='"SFMono-Regular", Consolas, monospace' font-size="13" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">P1</text>
<rect x="100" y="110" width="180" height="64" rx="3" ry="3" fill="none" stroke="#171717" stroke-width="1"/>
<text x="190.0" y="138.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="500" fill="#171717" text-anchor="middle">Framework</text>
<text x="190.0" y="158.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="500" fill="#171717" text-anchor="middle">synthesis</text>
<text x="100" y="208" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">OUTPUT</text>
<line x1="100" y1="218" x2="280" y2="218" stroke="#CDCDC7" stroke-width="1"/>
<text x="100" y="242" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">Taxonomy and codebook:</text>
<text x="100" y="263" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">8 problem domains ×</text>
<text x="100" y="284" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">11 solution categories</text>
<polyline points="280,142.0 320,142.0" fill="none" stroke="#171717" stroke-width="1" marker-end="url(#a)"/>
<text x="320" y="96" font-family='"SFMono-Regular", Consolas, monospace' font-size="13" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">P2</text>
<rect x="320" y="110" width="180" height="64" rx="3" ry="3" fill="none" stroke="#171717" stroke-width="1"/>
<text x="410.0" y="138.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="500" fill="#171717" text-anchor="middle">Systematic</text>
<text x="410.0" y="158.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="500" fill="#171717" text-anchor="middle">review</text>
<text x="320" y="208" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">OUTPUT</text>
<line x1="320" y1="218" x2="500" y2="218" stroke="#CDCDC7" stroke-width="1"/>
<text x="320" y="242" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">777 papers screened</text>
<text x="320" y="263" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">and classified; 755</text>
<text x="320" y="284" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">used downstream</text>
<polyline points="500,142.0 540,142.0" fill="none" stroke="#171717" stroke-width="1" marker-end="url(#a)"/>
<text x="540" y="96" font-family='"SFMono-Regular", Consolas, monospace' font-size="13" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">P3</text>
<rect x="540" y="110" width="180" height="64" rx="3" ry="3" fill="none" stroke="#171717" stroke-width="1"/>
<text x="630.0" y="138.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="500" fill="#171717" text-anchor="middle">Thematic</text>
<text x="630.0" y="158.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="500" fill="#171717" text-anchor="middle">synthesis</text>
<text x="540" y="208" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">OUTPUT</text>
<line x1="540" y1="218" x2="720" y2="218" stroke="#CDCDC7" stroke-width="1"/>
<text x="540" y="242" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">8 finance silos, themes</text>
<text x="540" y="263" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">and a 4 + 1 layer</text>
<text x="540" y="284" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">advantage assessment</text>
<polyline points="720,142.0 760,142.0" fill="none" stroke="#171717" stroke-width="1" marker-end="url(#a)"/>
<text x="760" y="96" font-family='"SFMono-Regular", Consolas, monospace' font-size="13" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">P4</text>
<rect x="760" y="110" width="180" height="64" rx="3" ry="3" fill="none" stroke="#171717" stroke-width="1"/>
<text x="850.0" y="138.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="500" fill="#171717" text-anchor="middle">Resource</text>
<text x="850.0" y="158.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="500" fill="#171717" text-anchor="middle">estimation</text>
<text x="760" y="208" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">OUTPUT</text>
<line x1="760" y1="218" x2="940" y2="218" stroke="#CDCDC7" stroke-width="1"/>
<text x="760" y="242" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">71 circuits costed with</text>
<text x="760" y="263" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">the Resource Estimator;</text>
<text x="760" y="284" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">13 tested on 5 criteria</text>
<polyline points="940,142.0 972,142.0" fill="none" stroke="#171717" stroke-width="1" marker-end="url(#a)"/>
<circle cx="990" cy="142.0" r="16" fill="none" stroke="#FF4D00" stroke-width="3"/>
<text x="1022" y="96" font-family='"SFMono-Regular", Consolas, monospace' font-size="13" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">FINDING</text>
<text x="1022" y="125.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="600" fill="#171717" text-anchor="start">None of the 13</text>
<text x="1022" y="146.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="600" fill="#171717" text-anchor="start">passed all five</text>
<text x="1022" y="167.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="600" fill="#171717" text-anchor="start">criteria.</text>
<line x1="1022" y1="218" x2="1160" y2="218" stroke="#CDCDC7" stroke-width="1"/>
<text x="1022" y="242" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">Loading data is the</text>
<text x="1022" y="263" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">bottleneck. Holds for</text>
<text x="1022" y="284" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">template circuits,</text>
<text x="1022" y="305" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">not the whole field.</text>
</svg>
